<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/garamnoh-design-system-778f1b11-024d-4ad4-b77a-7d1ab574d653/tokens/fonts.css">
<link rel="stylesheet" href="_ds/garamnoh-design-system-778f1b11-024d-4ad4-b77a-7d1ab574d653/tokens/colors.css">
<link rel="stylesheet" href="_ds/garamnoh-design-system-778f1b11-024d-4ad4-b77a-7d1ab574d653/tokens/typography.css">
<link rel="stylesheet" href="_ds/garamnoh-design-system-778f1b11-024d-4ad4-b77a-7d1ab574d653/tokens/spacing.css">
<link rel="stylesheet" href="_ds/garamnoh-design-system-778f1b11-024d-4ad4-b77a-7d1ab574d653/tokens/radius.css">
<link rel="stylesheet" href="_ds/garamnoh-design-system-778f1b11-024d-4ad4-b77a-7d1ab574d653/tokens/elevation.css">
<link rel="stylesheet" href="_ds/garamnoh-design-system-778f1b11-024d-4ad4-b77a-7d1ab574d653/tokens/motion.css">
<link rel="stylesheet" href="_ds/garamnoh-design-system-778f1b11-024d-4ad4-b77a-7d1ab574d653/tokens/base.css">
<link rel="stylesheet" href="_ds/garamnoh-design-system-778f1b11-024d-4ad4-b77a-7d1ab574d653/tokens/deck.css">
<link rel="stylesheet" href="_ds/garamnoh-design-system-778f1b11-024d-4ad4-b77a-7d1ab574d653/components/layout.css">
<link rel="stylesheet" href="_ds/garamnoh-design-system-778f1b11-024d-4ad4-b77a-7d1ab574d653/components/components.css">
<link rel="stylesheet" href="_ds/garamnoh-design-system-778f1b11-024d-4ad4-b77a-7d1ab574d653/components/wordmark.css">
<link rel="stylesheet" href="_ds/garamnoh-design-system-778f1b11-024d-4ad4-b77a-7d1ab574d653/tokens/zindex.css">
<link rel="stylesheet" href="_ds/garamnoh-design-system-778f1b11-024d-4ad4-b77a-7d1ab574d653/tokens/density.css">
<link rel="stylesheet" href="_ds/garamnoh-design-system-778f1b11-024d-4ad4-b77a-7d1ab574d653/components/extended.css">
<link rel="stylesheet" href="_ds/garamnoh-design-system-778f1b11-024d-4ad4-b77a-7d1ab574d653/tokens/print.css">
<link rel="stylesheet" href="_ds/garamnoh-design-system-778f1b11-024d-4ad4-b77a-7d1ab574d653/styles.css">
<script src="_ds/garamnoh-design-system-778f1b11-024d-4ad4-b77a-7d1ab574d653/_ds_bundle.js"></script>
</helmet>

<div style="width:1280px; height:800px; background:var(--bg); color:var(--text); font-family:var(--font); border:1px solid var(--line); display:flex; flex-direction:column; overflow:hidden; flex:none; position:relative; transform:translate(0);">

  <div data-tauri-drag-region="true" style="height:54px; flex:none; background:var(--bg-2); border-bottom:1px solid var(--line); display:flex; align-items:center; padding:0 16px 0 20px; gap:20px;">
    <div style="display:flex; gap:8px; flex:none;">
      <span style="width:12px; height:12px; border-radius:50%; background:var(--line);"></span>
      <span style="width:12px; height:12px; border-radius:50%; background:var(--line);"></span>
      <span style="width:12px; height:12px; border-radius:50%; background:var(--line);"></span>
    </div>
    <span style="font-family:var(--font-mono); font-weight:400; font-size:15px; letter-spacing:-0.02em; line-height:1; position:relative; display:inline-block; padding-right:0.36em; flex:none;">markly<span style="position:absolute; top:0; right:0; width:0.27em; height:0.27em; background:var(--accent);"></span></span>
    <div style="flex:1; min-width:0;"></div>
    <div style="display:flex; align-items:center; gap:8px; flex:none; width:240px;">
      <x-import component-from-global-scope="GaramnohDesignSystem_778f1b.Input" hint-size="100%,32px" size="sm" placeholder="검색" style="flex:1;"></x-import>
      <x-import component-from-global-scope="GaramnohDesignSystem_778f1b.Kbd" hint-size="auto,20px" keys="{{ cmdK }}"></x-import>
    </div>
    <div style="display:flex; align-items:center; gap:4px; flex:none;">
      <x-import component-from-global-scope="GaramnohDesignSystem_778f1b.IconButton" hint-size="32px,32px" glyph="▤" label="아웃라인" pressed="{{ outlineOn }}"></x-import>
      <x-import component-from-global-scope="GaramnohDesignSystem_778f1b.IconButton" hint-size="32px,32px" glyph="✳" label="Related Topics" pressed="{{ relatedOn }}"></x-import>
      <x-import component-from-global-scope="GaramnohDesignSystem_778f1b.IconButton" hint-size="32px,32px" glyph="⌘" label="설정"></x-import>
    </div>
  </div>

  <div style="flex:1; min-height:0; display:flex;">

    <div style="width:270px; flex:none; background:var(--bg-2); border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0;">
      <div style="flex:none; padding:8px 12px; border-bottom:1px solid var(--line-soft);">
        <x-import component-from-global-scope="GaramnohDesignSystem_778f1b.SegmentedControl" hint-size="100%,32px" options="{{ navOptions }}" value="{{ navValue }}" block="{{ yes }}"></x-import>
      </div>
      <div style="flex:1; min-height:0; overflow:hidden; display:{{ queueDisplay }};">
        <x-import component-from-global-scope="GaramnohDesignSystem_778f1b.SideNav" hint-size="100%,100%" groups="{{ queueGroups }}" current="{{ currentDoc }}"></x-import>
      </div>
      <div style="flex:1; min-height:0; overflow:hidden; display:{{ filesDisplay }}; padding:8px 4px;">
        <x-import component-from-global-scope="GaramnohDesignSystem_778f1b.TreeView" hint-size="100%,100%" nodes="{{ treeNodes }}" selected="fc" default-open="{{ treeOpen }}"></x-import>
      </div>
      <div style="height:38px; flex:none; border-top:1px solid var(--line-soft); display:flex; align-items:center; padding:0 12px; gap:8px;">
        <x-import component-from-global-scope="GaramnohDesignSystem_778f1b.Badge" hint-size="auto,18px" tone="success" dot="{{ yes }}">WATCHING</x-import>
        <span style="margin-left:auto; font-family:var(--font-mono); font-size:11px; color:var(--text-3); flex:none;">{{ docCount }}</span>
      </div>
    </div>

    <div style="flex:1; min-width:0; display:flex; flex-direction:column; background:var(--bg); overflow:hidden;">{{ children }}</div>

    <div style="width:269px; flex:none; background:var(--bg-2); border-left:1px solid var(--line); overflow:hidden; display:{{ outlineDisplay }}; flex-direction:column;">
      <div style="height:38px; flex:none; display:flex; align-items:center; padding:0 16px; border-bottom:1px solid var(--line-soft);">
        <x-import component-from-global-scope="GaramnohDesignSystem_778f1b.Label" hint-size="auto,14px">OUTLINE</x-import>
      </div>
      <div style="flex:1; min-height:0; overflow:hidden;">
        <x-import component-from-global-scope="GaramnohDesignSystem_778f1b.SideNav" hint-size="100%,100%" groups="{{ outlineGroups }}" current="typed"></x-import>
      </div>
    </div>

    <div style="width:268px; flex:none; background:var(--bg-2); border-left:1px solid var(--line); overflow:hidden; display:{{ relatedDisplay }}; flex-direction:column;">
      <div style="height:38px; flex:none; display:flex; align-items:center; padding:0 16px; border-bottom:1px solid var(--line-soft);">
        <x-import component-from-global-scope="GaramnohDesignSystem_778f1b.Label" hint-size="auto,14px">RELATED TOPICS</x-import>
      </div>
      <div style="flex:1; min-height:0; overflow:hidden;">
        <sc-for list="{{ relatedItems }}" as="item" hint-placeholder-count="4">
          <div style="padding:16px; border-bottom:1px solid var(--line-soft);">
            <div style="display:flex; align-items:baseline; gap:8px;">
              <span style="font-size:13px; font-weight:600;">{{ item.title }}</span>
              <span style="margin-left:auto; font-family:var(--font-mono); font-size:11px; color:{{ item.color }};">{{ item.score }}</span>
            </div>
            <div style="font-family:var(--font-mono); font-size:11px; color:var(--text-3); margin-top:5px;">{{ item.reason }}</div>
          </div>
        </sc-for>
      </div>
      <div style="flex:none; padding:16px; border-top:1px solid var(--line-soft);">
        <p style="font-size:12px; color:var(--text-3); margin:0; line-height:1.6;">공유 태그, 폴더, 링크, 용어, 읽은 순서로 순위를 낸다. 그래프도 백링크도 아니다.</p>
      </div>
    </div>

  </div>

  <div style="position:absolute; inset:0; z-index:200; display:{{ paletteDisplay }};">
    <x-import component-from-global-scope="GaramnohDesignSystem_778f1b.CommandPalette" hint-size="100%,100%" open="{{ yes }}" groups="{{ paletteGroups }}" placeholder="문서·명령 검색"></x-import>
  </div>

  <div style="position:absolute; inset:0; z-index:200; display:{{ conflictDisplay }};">
    <x-import component-from-global-scope="GaramnohDesignSystem_778f1b.Dialog" hint-size="100%,100%" open="{{ yes }}" title="파일이 밖에서 바뀌었다" desc="이 문서를 편집하는 동안 디스크의 파일도 바뀌었다. 어느 쪽을 남길지 고른다." footer="{{ conflictFooter }}">
      <div style="display:flex; flex-direction:column; gap:8px;">
        <div style="border:1px solid var(--line); padding:12px 14px; display:flex; align-items:center; gap:12px;">
          <x-import component-from-global-scope="GaramnohDesignSystem_778f1b.Badge" hint-size="auto,18px" tone="brand" dot="{{ yes }}">MINE</x-import>
          <div style="flex:1; min-width:0;">
            <div style="font-size:13px; font-weight:600;">내 편집</div>
            <div style="font-family:var(--font-mono); font-size:11px; color:var(--text-3);">저장 안 됨 · 14:22 · +18 −4</div>
          </div>
        </div>
        <div style="border:1px solid var(--line); padding:12px 14px; display:flex; align-items:center; gap:12px;">
          <x-import component-from-global-scope="GaramnohDesignSystem_778f1b.Badge" hint-size="auto,18px" tone="neutral" dot="{{ yes }}">DISK</x-import>
          <div style="flex:1; min-width:0;">
            <div style="font-size:13px; font-weight:600;">디스크의 파일</div>
            <div style="font-family:var(--font-mono); font-size:11px; color:var(--text-3);">v16 · 14:25 · 외부 편집</div>
          </div>
        </div>
      </div>
    </x-import>
  </div>

  <div style="position:absolute; right:0; bottom:0; z-index:300; display:{{ toastDisplay }};">
    <x-import component-from-global-scope="GaramnohDesignSystem_778f1b.Toaster" hint-size="340px,auto">
      <x-import component-from-global-scope="GaramnohDesignSystem_778f1b.Toast" hint-size="340px,64px" tone="info" title="업데이트 준비됨" desc="1.4.2 · 재시작하면 적용된다"></x-import>
      <x-import component-from-global-scope="GaramnohDesignSystem_778f1b.Toast" hint-size="340px,64px" tone="success" title="3개 문서를 읽음으로 표시했다" desc="되돌리기 ⌘Z"></x-import>
    </x-import>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800},&quot;nav&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;queue&quot;,&quot;files&quot;],&quot;default&quot;:&quot;queue&quot;,&quot;tsType&quot;:&quot;'queue' | 'files'&quot;},&quot;panelKind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;none&quot;,&quot;outline&quot;,&quot;related&quot;],&quot;default&quot;:&quot;none&quot;,&quot;tsType&quot;:&quot;'none' | 'outline' | 'related'&quot;},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;inbox&quot;,&quot;doc&quot;,&quot;none&quot;],&quot;default&quot;:&quot;doc&quot;,&quot;tsType&quot;:&quot;'inbox' | 'doc' | 'none'&quot;},&quot;overlay&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;none&quot;,&quot;palette&quot;,&quot;conflict&quot;,&quot;toast&quot;],&quot;default&quot;:&quot;none&quot;,&quot;tsType&quot;:&quot;'none' | 'palette' | 'conflict' | 'toast'&quot;},&quot;docCount&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;412 docs&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;children&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;React.ReactNode&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props || {};
    const nav = p.nav || 'queue';
    const panelKind = p.panelKind || 'none';
    const active = p.active || 'doc';
    const overlay = p.overlay || 'none';
    const R = React.createElement;
    const NS = (typeof window !== 'undefined' && window.GaramnohDesignSystem_778f1b) || {};

    return {
      children: p.children,
      docCount: p.docCount || '412 docs',
      yes: true,
      cmdK: ['⌘', 'K'],

      navOptions: [{ value: 'queue', label: 'QUEUE' }, { value: 'files', label: 'FILES' }],
      navValue: nav,
      queueDisplay: nav === 'queue' ? 'block' : 'none',
      filesDisplay: nav === 'files' ? 'block' : 'none',

      outlineOn: panelKind === 'outline',
      relatedOn: panelKind === 'related',
      outlineDisplay: panelKind === 'outline' ? 'flex' : 'none',
      relatedDisplay: panelKind === 'related' ? 'flex' : 'none',

      paletteDisplay: overlay === 'palette' ? 'block' : 'none',
      conflictDisplay: overlay === 'conflict' ? 'block' : 'none',
      toastDisplay: overlay === 'toast' ? 'block' : 'none',

      currentDoc: active === 'inbox' ? 'inbox' : (active === 'doc' ? 'fc' : ''),

      queueGroups: [
        { items: [{ id: 'inbox', label: 'Knowledge Inbox', meta: '3' }] },
        { label: 'UPDATES', items: [
          { id: 'api', label: 'API Design Notes', glyph: '▪', meta: 'v15 · 2h' },
          { id: 'fc', label: 'Function Calling', glyph: '▪', meta: 'v9 · 5h' },
          { id: 're', label: 'Retrieval Eval', glyph: '▪', meta: 'v3 · 1d' }
        ] },
        { label: 'UNREAD', items: [
          { id: 'pc', label: 'Prompt Caching', glyph: '▫', meta: 'new · 3h' },
          { id: 'mcp', label: 'MCP Transport', glyph: '▫', meta: 'new · 1d' },
          { id: 'ipc', label: 'Tauri IPC', glyph: '▫', meta: 'new · 2d' }
        ] },
        { label: 'PINNED', items: [
          { id: 'arch', label: 'Architecture Overview', glyph: '▌' },
          { id: 'rl', label: 'Reading List', glyph: '▌' }
        ] },
        { label: 'RECENT', items: [
          { id: 'emb', label: 'Embeddings 101', meta: '2d' },
          { id: 'rust', label: 'Rust Error Handling', meta: '4d' },
          { id: 'wr', label: 'Weekly Review', meta: '1w' }
        ] }
      ],

      treeNodes: [
        { id: 'notes', label: 'notes', children: [
          { id: 'api', label: 'api', children: [
            { id: 'dn', label: 'design-notes.md', meta: '▪' },
            { id: 'fc', label: 'function-calling.md', meta: '▪' },
            { id: 'st', label: 'streaming.md' }
          ] },
          { id: 'rust', label: 'rust', meta: '18', children: [{ id: 'r1', label: 'ipc.md' }] },
          { id: 'research', label: 'research', meta: '64', children: [{ id: 'g1', label: 'mcp.md' }] },
          { id: 'daily', label: 'daily', meta: '301', children: [{ id: 'd1', label: '2026-09-06.md' }] }
        ] }
      ],
      treeOpen: ['notes', 'api'],

      outlineGroups: [
        { items: [
          { id: 'ov', label: 'Overview' },
          { id: 'typed', label: 'Typed calls' },
          { id: 'schema', label: 'Schema' },
          { id: 'valid', label: 'Validation' },
          { id: 'err', label: 'Errors' },
          { id: 'stream', label: 'Streaming' },
          { id: 'also', label: 'See also' }
        ] }
      ],

      relatedItems: [
        { title: 'Tool Use', score: '0.92', reason: 'shared tags · 3 links', color: 'var(--accent-text)' },
        { title: 'Structured Output', score: '0.81', reason: 'linked · same folder', color: 'var(--accent-text)' },
        { title: 'JSON Schema', score: '0.74', reason: 'shared terms', color: 'var(--text-2)' },
        { title: 'Streaming', score: '0.66', reason: 'reading history', color: 'var(--text-2)' }
      ],

      paletteGroups: [
        { label: 'JUMP TO', items: [
          { id: 'fc', label: 'Function Calling', glyph: '▪', hint: 'notes/api · v9' },
          { id: 'so', label: 'Structured Output', hint: 'notes/api' },
          { id: 'tu', label: 'Tool Use — function schemas', hint: 'notes/research' }
        ] },
        { label: 'COMMANDS', items: [
          { id: 'read', label: '모두 읽음', glyph: '✳', hint: '⌘⇧R' },
          { id: 'tmpl', label: '템플릿에서 새 노트', glyph: '✳', hint: '⌘⇧N' }
        ] },
        { label: 'UPDATES', items: [
          { id: 'api', label: 'API Design Notes', glyph: '▪', hint: 'v12 → v15' }
        ] }
      ],

      conflictFooter: NS.Button ? R('div', { style: { display: 'flex', gap: 8, width: '100%' } },
        R(NS.Button, { key: 'd', variant: 'ghost' }, '차이 보기'),
        R('span', { key: 's', style: { marginLeft: 'auto' } }),
        R(NS.Button, { key: 'w' }, '디스크 쓰기'),
        R(NS.Button, { key: 'k', variant: 'brand' }, '내 편집 유지')
      ) : null
    };
  }
}
</script>
</body>
</html>
